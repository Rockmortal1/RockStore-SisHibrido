version: '3.8'

services:
  #1 El microservicio de la identidad (en C#)
  auth-api:
    build:
      context: ./auth-service
    ports:
      - "5000:80"
    environment:
      - JWT_SECRET=El_gran_super_secreto_mio

  #2 El Microservicio de las Reglas de negocio (En Phyton)
  core-api:
    build:
      context: -/core-service
    ports:
      - "8000:8000"
    depends_on:
      -auth-api

  frontedn:
  #3 La interfaz de Usuario (En React)
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-api
      - core-api